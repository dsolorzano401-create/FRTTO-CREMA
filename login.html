<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutto & Crema - Iniciar Sesión</title>
    <link rel="stylesheet" href="login (1).css">
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="logo (1).png" alt="Frutto & Crema Logo" class="logo">
            <h2>Frutto & Crema</h2>
            <p>Sistema de Gestión y Pedidos</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <button type="submit" class="btn-login">Ingresar al Sistema</button>
        </form>
    </div>
    <script src="js (1)/login (1).js"></script>
</body>
</html>
